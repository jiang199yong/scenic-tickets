<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文旅服务</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f7f6;color:#222}
header{background:#1f6f5c;color:#fff;padding:14px 20px;font-size:18px;font-weight:700}
.hero{background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),url('https://picsum.photos/1600/600?random=1') center/cover;height:40vh;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.hero h1{font-size:clamp(22px,5vw,38px)}
.wrap{padding:30px 16px;max-width:1100px;margin:0 auto}
h2{color:#1f6f5c;margin-bottom:16px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);text-decoration:none;color:inherit;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:130px;object-fit:cover}
.card .info{padding:12px}
.card .info h3{font-size:16px;margin-bottom:4px}
.card .info p{font-size:13px;color:#666}
.card .info span{color:#1f6f5c;font-weight:600;font-size:13px}
footer{text-align:center;padding:20px;color:#999;font-size:12px}
</style>
</head>
<body>

<header>文旅服务</header>

<section class="hero">
  <div>
    <h1>山水相连 · 文旅同行</h1>
    <p style="margin-top:8px;opacity:.9">都江堰 · 彭州 · 阿坝州 · 特色好物</p>
  </div>
</section>

<div class="wrap">
  <h2>选择服务区域</h2>
  <div class="grid">

    <a class="card" href="tickets.html?city=djy">
      <img src="https://picsum.photos/400/300?random=2" alt="">
      <div class="info">
        <h3>都江堰市</h3>
        <p>古堰流水 · 青城幽山</p>
        <span>景区购票 →</span>
      </div>
    </a>

    <a class="card" href="tickets.html?city=pz">
      <img src="https://picsum.photos/400/300?random=3" alt="">
      <div class="info">
        <h3>彭州市</h3>
        <p>龙门山 · 白鹿小镇</p>
        <span>景区购票 →</span>
      </div>
    </a>

    <a class="card" href="tickets.html?city=aba">
      <img src="https://picsum.photos/400/300?random=4" alt="">
      <div class="info">
        <h3>阿坝州</h3>
        <p>九寨黄龙 · 四姑娘山</p>
        <span>景区购票 →</span>
      </div>
    </a>

    <a class="card" href="goods.html?city=djy">
      <img src="https://picsum.photos/400/300?random=5" alt="">
      <div class="info">
        <h3>特色商品</h3>
        <p>三地好物 · 带走的风景</p>
        <span>查看商品 →</span>
      </div>
    </a>

  </div>
</div>

<footer>文旅服务 · 静态导航页</footer>
</body>
</html>
